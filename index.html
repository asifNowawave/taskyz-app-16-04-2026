<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
<!--  <base href="/">-->
  <base href="/" />
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Enhanced browser compatibility -->
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Taskyz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Taskyz</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Disable trackpad back/forward swipe
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.pushState(null, null, location.href);
    };
  </script>





  <script>
    // Enhanced cross-browser service worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        // Check browser compatibility first
        const isSupported = 'serviceWorker' in navigator && 'PushManager' in window;
        
        if (isSupported) {
          navigator.serviceWorker
            .register('firebase-messaging-sw.js').then(function (registration) {
              console.log('✅ Firebase Messaging Service Worker registered:', registration);
              console.log('🔔 Web push notifications are now enabled');

              // Enhanced notification support check
              if ('Notification' in window) {
                console.log('✅ Notifications API supported');
                console.log('📋 Current permission:', Notification.permission);

                if (Notification.permission === 'granted') {
                  console.log('✅ Notification permission already granted');
                } else if (Notification.permission === 'denied') {
                  console.log('❌ Notification permission denied');
                } else {
                  console.log('⚠️ Notification permission not requested yet');
                }
              } else {
                console.log('❌ Notifications API not supported');
              }
            })
            .catch(function (err) {
              console.log('❌ Service Worker registration failed:', err);
              // Fallback for browsers with limited service worker support
              console.log('🔄 Attempting fallback registration...');
            });
        } else {
          console.log('❌ Service Worker or Push Manager not supported in this browser');
        }
      });
    } else {
      console.log('❌ Service Worker not supported in this browser');
    }
  </script>
</body>
</html>
